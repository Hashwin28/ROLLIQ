; =============================================================================
; ROLLIQ Firmware — Bed-Mobility Monitoring System
; ESP32 NodeMCU (30-pin) + MPU6050 (6-axis IMU)
; =============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Build flags — keep CORE_DEBUG_LEVEL at 0 for production, 5 for verbose debug
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_RUNNING_CORE=1

; Library dependencies
lib_deps =
    Wire
    WiFi
    HTTPClient
    bblanchon/ArduinoJson@^6.21.0
    links2004/WebSockets@^2.4.0

; Upload / monitor settings
upload_speed = 921600
monitor_filters = esp32_exception_decoder
